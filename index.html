<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinterest Video Downloader</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4f5;font-family:Arial,sans-serif;color:#252525;display:grid;min-height:100vh;place-items:center;padding:18px}.box{width:min(100%,440px);background:white;padding:25px;border-radius:18px;box-shadow:0 8px 30px #0001;text-align:center}h1{font-size:25px;color:#bd1230;margin:0 0 8px}p{font-size:14px;line-height:1.5;color:#666}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin:12px 0}button{width:100%;padding:14px;border:0;border-radius:10px;background:#c9183b;color:white;font-size:16px;font-weight:bold}button:disabled{opacity:.6}#msg{overflow-wrap:anywhere}</style></head><body><main class="box"><h1>📌 Pinterest Video Downloader</h1><p>ভিডিওর Pinterest লিংক পেস্ট করে ডাউনলোড করুন।</p><input id="url" type="url" placeholder="Pinterest ভিডিও লিংক পেস্ট করুন"><button id="btn">ভিডিও ডাউনলোড</button><p id="msg"></p></main><script>
// Deploy the API service, then paste its URL below (without a trailing slash).
const API_BASE = 'https://pinterest-downloader-k0rg.onrender.com';
const btn=document.getElementById('btn'),msg=document.getElementById('msg');
btn.onclick=async()=>{const url=document.getElementById('url').value.trim();if(!url){msg.textContent='আগে Pinterest লিংক দিন।';return}if(API_BASE.includes('PASTE_YOUR')){msg.textContent='এখনো ব্যাকএন্ড চালু হয়নি। README ফাইলে নির্দেশনা দেখুন।';return}btn.disabled=true;msg.textContent='ভিডিও প্রস্তুত হচ্ছে, অপেক্ষা করুন…';try{const r=await fetch(API_BASE+'/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(!r.ok){let e={};try{e=await r.json()}catch{}throw new Error(e.error||'ডাউনলোড হয়নি।')}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pinterest-video.mp4';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);msg.textContent='ডাউনলোড শুরু হয়েছে।'}catch(e){msg.textContent=e.message||'সমস্যা হয়েছে; আবার চেষ্টা করুন।'}finally{btn.disabled=false}};
</script></body></html>
